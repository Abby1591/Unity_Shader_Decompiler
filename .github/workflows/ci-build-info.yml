name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: UnityShaderDecompiler.sln
  PROJECT: src/UnityShaderDecompiler.Cli/UnityShaderDecompiler.Cli.csproj
  TEST_PROJECT: tests/UnityShaderDecompiler.Tests/UnityShaderDecompiler.Tests.csproj
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    name: 🏗️ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      BUILD_DIR: Builds/${{ matrix.os }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📋 Environment Information
        shell: bash
        run: |
          echo "::group::Repository Information"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $(git rev-parse --short HEAD)"
          git --no-pager log -1 --pretty=format:"Author     : %an%nMessage    : %s%nDate       : %ad"
          echo
          echo "::endgroup::"

          echo "::group::.NET SDK Information"
          dotnet --info
          echo
          echo "Installed SDKs"
          dotnet --list-sdks
          echo "::endgroup::"

      - name: 💾 Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 📥 Restore Packages
        shell: bash
        run: dotnet restore "$SOLUTION"

      - name: 🏗️ Build
        shell: bash
        run: |
          mkdir -p "$BUILD_DIR/Logs"

          echo "::group::Building"
          START=$(date +%s)

          dotnet build "$SOLUTION" \
            -c Release \
            --no-restore \
            -bl:"$BUILD_DIR/Logs/build.binlog" \
            2>&1 | tee "$BUILD_DIR/Logs/build.log"

          END=$(date +%s)

          echo "::endgroup::"
          echo "Build completed in $((END - START)) seconds."

      - name: 🧪 Regression Tests
        shell: bash
        run: |
          echo "::group::dotnet test (fast tier)"
          dotnet test "$TEST_PROJECT" \
            -c Release \
            --no-build \
            --filter "Category!=D3D" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "$BUILD_DIR/Logs" \
            2>&1 | tee "$BUILD_DIR/Logs/tests.log"
          echo "::endgroup::"

      - name: 🚬 CLI Smoke Test
        shell: bash
        run: |
          echo "::group::CLI smoke test"
          dotnet "src/UnityShaderDecompiler.Cli/bin/Release/net10.0/Shader Decompiler.dll" --run-spec-tests \
            2>&1 | tee "$BUILD_DIR/Logs/spec-tests.log"
          echo "::endgroup::"

      - name: 📤 Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ matrix.os }}
          path: ${{ env.BUILD_DIR }}/Logs
          if-no-files-found: ignore

      - name: ✅ Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ✅ Build: ${{ matrix.os }}"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| OS | $RUNNER_OS |"
            echo "| .NET | $DOTNET_VERSION |"
            echo "| Configuration | Release |"
            echo "| Artifacts | Not published (nightly only) |"
            echo "| Logs | \`$BUILD_DIR/Logs\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: 🐍 Python tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Dependencies
        run: python -m pip install --quiet lz4

      - name: 🧪 Schema and Metadata Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
