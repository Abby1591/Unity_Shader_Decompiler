name: CI — Build & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        dotnet:
          - "10.0.x"

    env:
      BUILD_DIR: Builds/${{ matrix.os }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: 📋 Repository Information
        shell: bash
        run: |
          echo "::group::Repository Information"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $(git rev-parse --short HEAD)"
          git --no-pager log -1 --pretty=format:"Author     : %an%nMessage    : %s%nDate       : %ad"
          echo
          echo "::endgroup::"

      - name: 📦 .NET Information
        shell: bash
        run: |
          echo "::group::.NET SDK Information"
          dotnet --info
          echo
          echo "Installed SDKs"
          dotnet --list-sdks
          echo "::endgroup::"

      - name: 💾 Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
            ~\.nuget\packages
            ~\AppData\Local\NuGet\v3-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 📥 Restore Packages
        run: dotnet restore Parser.csproj

      - name: 🚀 Publish (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$BUILD_DIR/Output"
          mkdir -p "$BUILD_DIR/Logs"

          echo "::group::Publishing"

          START=$(date +%s)

          dotnet publish Parser.csproj \
            -c Release \
            --no-restore \
            -o "$BUILD_DIR/Output" \
            /bl:"$BUILD_DIR/Logs/build.binlog" \
            | tee "$BUILD_DIR/Logs/build.log"

          END=$(date +%s)

          echo "::endgroup::"

          echo "Build completed in $((END-START)) seconds."

      - name: 🚀 Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:BUILD_DIR\Output" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_DIR\Logs" | Out-Null

          Write-Host "::group::Publishing"

          $start = Get-Date

          dotnet publish Parser.csproj `
            -c Release `
            --no-restore `
            -o "$env:BUILD_DIR\Output" `
            /bl:"$env:BUILD_DIR\Logs\build.binlog" |
            Tee-Object -FilePath "$env:BUILD_DIR\Logs\build.log"

          $elapsed = (Get-Date) - $start

          Write-Host "::endgroup::"

          Write-Host "Build completed in $($elapsed.TotalSeconds.ToString('0.00')) seconds."

      - name: 📂 Published Files (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "::group::Published Files"
          find "$BUILD_DIR/Output" -type f | sort
          echo "::endgroup::"

      - name: 📂 Published Files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "::group::Published Files"
          Get-ChildItem "$env:BUILD_DIR\Output" -Recurse |
            Where-Object {!$_.PSIsContainer} |
            Select-Object FullName
          Write-Host "::endgroup::"

      - name: ✅ Build Summary
        if: always()
        shell: bash
        run: |
          echo "### ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| OS | $RUNNER_OS |" >> $GITHUB_STEP_SUMMARY
          echo "| .NET | ${{ matrix.dotnet }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Release |" >> $GITHUB_STEP_SUMMARY
          echo "| Output Folder | \`Builds/${{ matrix.os }}/Output\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Logs | \`Builds/${{ matrix.os }}/Logs\` |" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Parser-${{ matrix.os }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          compression-level: 9