name: CI — Build & Info

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ["10.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create Builds folder (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p Builds/${{ matrix.os }}

      - name: Create Builds folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Builds/${{ matrix.os }}" | Out-Null  

      - name: Commit / repo info
        run: |
          echo "::group::Commit info"
          echo "Ref: $GITHUB_REF"
          git --no-pager log -1 --pretty=format:"%h %s (%an)"
          echo "::endgroup::"

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Dotnet SDK info
        run: |
          echo "::group::dotnet --info"
          dotnet --info
          echo "::endgroup::"
          echo "::group::Installed SDKs"
          dotnet --list-sdks
          echo "::endgroup::"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          echo "::group::dotnet restore"
          dotnet restore Parser.csproj --verbosity minimal
          echo "::endgroup::"

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          echo "::group::dotnet build (console + log)"
          dotnet build Parser.csproj --configuration Release --no-restore /bl:build_${{ matrix.os }}.binlog | tee build_${{ matrix.os }}.log
          echo "::endgroup::"
          
      - name: Collect build outputs (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p Builds/${{ matrix.os }}/Logs
          mkdir -p Builds/${{ matrix.os }}/Output

          cp build_${{ matrix.os }}.log Builds/${{ matrix.os }}/Logs/
          cp build_${{ matrix.os }}.binlog Builds/${{ matrix.os }}/Logs/

          find . -path "*/bin/Release/*" -type f \
            ! -name "*.pdb" \
            -exec cp --parents {} Builds/${{ matrix.os }}/Output \;    

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "::group::dotnet build (console + log)"
          dotnet build Parser.csproj --configuration Release --no-restore /bl:build_${{ matrix.os }}.binlog | Tee-Object -FilePath build_${{ matrix.os }}.log
          Write-Host "::endgroup::"

            - name: Collect build outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Builds/${{ matrix.os }}\Logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "Builds/${{ matrix.os }}\Output" | Out-Null

          Copy-Item "build_${{ matrix.os }}.log" "Builds/${{ matrix.os }}\Logs\"
          Copy-Item "build_${{ matrix.os }}.binlog" "Builds/${{ matrix.os }}\Logs\"

          Get-ChildItem -Recurse -Path . -Filter * |
            Where-Object {
              $_.FullName -match "\\bin\\Release\\" -and
              -not $_.PSIsContainer -and
              $_.Extension -ne ".pdb"
            } |
            ForEach-Object {
              $relative = Resolve-Path -Relative $_.FullName
              $dest = Join-Path "Builds/${{ matrix.os }}\Output" $relative
              $dir = Split-Path $dest
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item $_.FullName $dest
            }

      - name: Show build summary & artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          echo "::group::Build summary"
          if grep -q "Build succeeded." build_${{ matrix.os }}.log 2>/dev/null; then
            echo "✅ Build succeeded on $RUNNER_OS"
          else
            echo "❌ Build may have failed; check logs"
          fi
          echo "Binary log: build_${{ matrix.os }}.binlog"
          echo "::endgroup::"

      - name: Show build summary & artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "::group::Build summary"
          if (Select-String -Path build_${{ matrix.os }}.log -Pattern "Build succeeded." -SimpleMatch -Quiet 2>$null) {
            Write-Host "✅ Build succeeded on $env:RUNNER_OS"
          } else {
            Write-Host "❌ Build may have failed; check logs"
          }
          Write-Host "Binary log: build_${{ matrix.os }}.binlog"
          Write-Host "::endgroup::"

      - name: List built files (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          echo "::group::Built files (top 200 lines)"
          ls -R **/bin/Release || true
          echo "::endgroup::"

      - name: List built files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "::group::Built files (top 200 lines)"
          Get-ChildItem -Path "**/bin/Release" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "::endgroup::"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-build-${{ matrix.os }}
          path: Builds/${{ matrix.os }}
          if-no-files-found: warn